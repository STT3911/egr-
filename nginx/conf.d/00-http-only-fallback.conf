# EGR Service - HTTP only (SSL certs not yet present)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lookup_per_ip:10m rate=15r/m;

server {
  listen 80;
  server_name test.tendex.by _;
  resolver 127.0.0.11 valid=30s;
  server_tokens off;
  client_max_body_size 100M;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~* "(?:\.\.|%2e%2e|/etc/passwd|/proc/|/\.env|/\.git|/wp-|/phpmyadmin|/vendor/)" {
    access_log off;
    return 404;
  }

  location ^~ /v1/ {
    return 404;
  }

  location / {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api {
    limit_req zone=api_per_ip burst=20 nodelay;
    set $backend_upstream http://egr-api:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location = /api/v1/companies/lookup {
    limit_req zone=lookup_per_ip burst=10 nodelay;
    set $backend_upstream http://egr-api:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location ~ ^/(docs|redoc|openapi.json) {
    return 404;
  }
  location /health {
    set $backend_upstream http://egr-api:8000;
    proxy_pass $backend_upstream/api/v1/health;
    access_log off;
  }
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webmanifest)$ {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}
