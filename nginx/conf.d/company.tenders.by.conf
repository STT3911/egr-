# Tendex company service - company.tenders.by (HTTPS)
# Certificates are copied from Let's Encrypt into ./ssl by ssl-copy or the
# deployment helper. HTTPS reaches this container through Xray using PROXY v1.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=180r/m;
limit_req_zone $binary_remote_addr zone=api_lookup:10m rate=80r/m;

server {
  listen 80;
  server_name company.tenders.by _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://company.tenders.by$request_uri;
  }
}

server {
  listen 80;
  server_name test.tendex.by;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://test.tendex.by$request_uri;
  }
}

# Development environment. The dev containers join the production proxy
# network under dedicated aliases, while their database and Redis stay on an
# isolated network and separate volumes.
server {
  listen 443 ssl proxy_protocol;
  http2 on;
  server_name test.tendex.by;
  limit_req_status 429;

  resolver 127.0.0.11 valid=30s;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header proxy_protocol;
  server_tokens off;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 512M;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "frame-ancestors 'self';" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location ~* "(?:\.\.|%2e%2e|/etc/passwd|/proc/|/\.env|/\.git|/wp-|/phpmyadmin|/vendor/)" {
    access_log off;
    return 404;
  }

  location ^~ /v1/ {
    return 404;
  }

  location ~ ^/api/v1/companies/lookup {
    if ($http_user_agent = "") { return 444; }
    limit_req zone=api_lookup burst=80 nodelay;
    set $backend_upstream http://egr-dev-api:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location ~ ^/(api|bitrix)(/|$) {
    if ($http_user_agent = "") { return 444; }
    limit_req zone=api_general burst=180 nodelay;
    set $backend_upstream http://egr-dev-api:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location ~ ^/(docs|redoc|openapi.json) {
    set $backend_upstream http://egr-dev-api:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health {
    set $backend_upstream http://egr-dev-api:8000;
    proxy_pass $backend_upstream/api/v1/health;
    access_log off;
  }

  location / {
    set $frontend_upstream http://egr-dev-frontend:80;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webmanifest)$ {
    set $frontend_upstream http://egr-dev-frontend:80;
    proxy_pass $frontend_upstream;
    expires 1h;
    add_header Cache-Control "public";
  }

  access_log /var/log/nginx/dev-access.log;
  error_log /var/log/nginx/dev-error.log;
}

