services:
    db:
      image: postgres:15-alpine
      container_name: egr_db
      environment:
        POSTGRES_DB: ${DB_NAME:-egr_db}
        POSTGRES_USER: ${DB_USER:-postgres}
        POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      volumes:
        - egr_postgres_data:/var/lib/postgresql/data
      ports:
        - "5434:5432"
      networks:
        - egr_default
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5

    redis:
      image: redis:7-alpine
      container_name: egr_redis
      ports:
        - "6380:6379"
      networks:
        - egr_default
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 3s
        retries: 5

    # One-time init: migrations + SQL scripts + ref tables. API starts only after this completes.
    egr-init:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_init
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - egr_default
      restart: "no"
      # Entrypoint runs: wait DB → alembic → run_sql_and_monitoring.sh; then CMD runs ref tables and exits
      command: >
        bash -c "python -c \"from app.tasks.sync_tasks import update_reference_tables; update_reference_tables.run()\" || true; exit 0"

    egr-api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_api
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
        APP_ENV: ${APP_ENV:-production}
        DEBUG: ${DEBUG:-false}
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        API_KEY: ${API_KEY:-}
        ALLOWED_API_KEYS: ${ALLOWED_API_KEYS:-}
        CORS_ORIGINS: ${CORS_ORIGINS:-*}
        SKIP_SQL_INIT: "1"
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      ports:
        - "8002:8000"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-init:
          condition: service_completed_successfully
      networks:
        - egr_default
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s
      command: >
        sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    egr-celery-worker:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_worker
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      # concurrency 6: больше параллельных задач; prefetch 4 — быстрее забирает из очереди
      command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=6 --prefetch-multiplier=4 --max-tasks-per-child=500

    egr-celery-beat:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_beat
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      # Schedule file in /tmp so appuser can write (volume /app is often read-only for container user)
      command: celery -A app.tasks.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

    data-init:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_data_init
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      command: /bin/bash /app/scripts/docker-init-data.sh

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          VITE_API_URL: ""
      container_name: egr_frontend
      ports:
        - "3000:80"
      networks:
        - egr_default
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s

    frontend-dev:
      build:
        context: ./frontend
        dockerfile: Dockerfile.dev
      container_name: egr_frontend_dev
      environment:
        VITE_API_URL: http://localhost:8002
      ports:
        - "5173:5173"
      networks:
        - egr_default
      profiles:
        - dev

    # One-shot: copy Let's Encrypt certs to ./ssl before nginx starts
    ssl-copy:
      image: alpine:3.19
      container_name: egr_ssl_copy
      volumes:
        - "${LETSENCRYPT_LIVE:-/etc/letsencrypt/live/test.tendex.by}:/source:ro"
        - ./ssl:/dest
      user: "0"
      command: >
        sh -c "
        if [ -f /source/fullchain.pem ] && [ -f /source/privkey.pem ]; then
          cp /source/fullchain.pem /dest/ && cp /source/privkey.pem /dest/ &&
          chown -R 1000:1000 /dest &&
          echo 'SSL certs copied to ./ssl';
        else
          echo 'No certs at /source (fullchain.pem or privkey.pem missing), skipping copy';
        fi
        "
      restart: "no"

    egr-nginx:
      image: nginx:1.25-alpine
      container_name: egr_nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/conf.d:/etc/nginx/conf.d
        - ./ssl:/etc/nginx/ssl:ro
        - ./scripts/nginx-entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
      command: ["nginx", "-g", "daemon off;"]
      depends_on:
        ssl-copy:
          condition: service_completed_successfully
        egr-api:
          condition: service_healthy
        frontend:
          condition: service_healthy
      networks:
        - egr_default
      restart: unless-stopped

volumes:
  egr_postgres_data:
    driver: local

networks:
  egr_default:
    driver: bridge
