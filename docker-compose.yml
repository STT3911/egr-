services:
    db:
      image: postgres:15-alpine
      container_name: egr_db
      environment:
        POSTGRES_DB: ${DB_NAME:-egr_db}
        POSTGRES_USER: ${DB_USER:-postgres}
        POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      volumes:
        - egr_postgres_data:/var/lib/postgresql/data
      ports:
        # Только localhost — БД НЕ должна быть доступна из интернета (Docker иначе обходит ufw).
        - "127.0.0.1:5434:5432"
      networks:
        - egr_default
      mem_limit: 512m
      command: >
        postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=80
        -c effective_cache_size=384MB
        -c checkpoint_completion_target=0.9
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5

    redis:
      image: redis:7-alpine
      container_name: egr_redis
      ports:
        # Только localhost — Redis наружу не выставляем.
        - "127.0.0.1:6380:6379"
      networks:
        - egr_default
      mem_limit: 128m
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 3s
        retries: 5

    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.3}
      container_name: egr_elasticsearch
      environment:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms384m -Xmx384m}"
      volumes:
        - egr_elasticsearch_data:/usr/share/elasticsearch/data
      ports:
        - "127.0.0.1:9200:9200"
      networks:
        - egr_default
      mem_limit: 640m
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 12
        start_period: 30s


    # One-time init: migrations + SQL scripts + ref tables.
    # Profile-gated: НЕ поднимается при обычном `docker compose up`.
    # Запускать вручную только после деплоя с новыми миграциями:
    #   docker compose --profile init up egr-init
    egr-init:
      profiles:
        - init
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_init
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - egr_default
      restart: "no"
      # Entrypoint runs: wait DB → alembic → run_sql_and_monitoring.sh; then CMD runs ref tables and exits
      command: >
        bash -c "python -c \"from app.tasks.sync_tasks import update_reference_tables; update_reference_tables.run()\" || true; exit 0"

    egr-api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_api
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
        ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
        ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-egr_companies}
        ELASTICSEARCH_REQUIRE_SYNCED: ${ELASTICSEARCH_REQUIRE_SYNCED:-true}
        ELASTICSEARCH_QUEUE_BATCH_SIZE: ${ELASTICSEARCH_QUEUE_BATCH_SIZE:-500}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
        APP_ENV: ${APP_ENV:-production}
        DEBUG: ${APP_DEBUG:-false}
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        API_KEY: ${API_KEY:-}
        ALLOWED_API_KEYS: ${ALLOWED_API_KEYS:-}
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        ALLOWED_HOSTS: ${ALLOWED_HOSTS:-company.tenders.by,test.tendex.by,localhost,127.0.0.1,egr-api,egr_api}
        CORS_ORIGINS: ${CORS_ORIGINS:-*}
        SKIP_SQL_INIT: "1"
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      ports:
        # Только localhost — наружу API отдаётся через nginx (/api) с rate-limit и заголовками.
        - "127.0.0.1:8002:8000"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - egr_default
      mem_limit: 256m
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ready || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s
      command: >
        sh -c "if [ \"${UVICORN_RELOAD:-0}\" = \"1\" ]; then exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload; else exec uvicorn app.main:app --host 0.0.0.0 --port 8000; fi"

    egr-unp-pipeline:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_unp_pipeline
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        SKIP_SQL_INIT: "1"
        UNP_PIPELINE_REGIONS: ${UNP_PIPELINE_REGIONS:-1,2,3,4,5,6,7}
        UNP_PIPELINE_SCAN_MODE: ${UNP_PIPELINE_SCAN_MODE:-frontier}
        UNP_PIPELINE_FRONTIER_LOOKAHEAD: ${UNP_PIPELINE_FRONTIER_LOOKAHEAD:-50}
        UNP_PIPELINE_FRONTIER_BACKTRACK: ${UNP_PIPELINE_FRONTIER_BACKTRACK:-50}
        UNP_PIPELINE_RANGE_GAP: ${UNP_PIPELINE_RANGE_GAP:-50}
        UNP_PIPELINE_REGISTRY_REFRESH_INTERVAL_SECONDS: ${UNP_PIPELINE_REGISTRY_REFRESH_INTERVAL_SECONDS:-86400}
        UNP_PIPELINE_FRONTIER_INTERVAL_SECONDS: ${UNP_PIPELINE_FRONTIER_INTERVAL_SECONDS:-300}
        UNP_PIPELINE_NOT_FOUND_RECHECK_SECONDS: ${UNP_PIPELINE_NOT_FOUND_RECHECK_SECONDS:-86400}
        UNP_PIPELINE_PARTIAL_RECHECK_SECONDS: ${UNP_PIPELINE_PARTIAL_RECHECK_SECONDS:-86400}
        UNP_PIPELINE_ERROR_RECHECK_SECONDS: ${UNP_PIPELINE_ERROR_RECHECK_SECONDS:-300}
        UNP_PIPELINE_EMPTY_STOP: ${UNP_PIPELINE_EMPTY_STOP:-20000}
        UNP_PIPELINE_CONCURRENCY: ${UNP_PIPELINE_CONCURRENCY:-2}
        UNP_PIPELINE_CANDIDATE_BATCH: ${UNP_PIPELINE_CANDIDATE_BATCH:-500}
        UNP_PIPELINE_DELAY: ${UNP_PIPELINE_DELAY:-2.0}
        UNP_PIPELINE_CHECKPOINT_EVERY: ${UNP_PIPELINE_CHECKPOINT_EVERY:-20}
        UNP_PIPELINE_PROCESS_BATCH: ${UNP_PIPELINE_PROCESS_BATCH:-2000}
        UNP_PIPELINE_PROCESS_INTERVAL_SECONDS: ${UNP_PIPELINE_PROCESS_INTERVAL_SECONDS:-60}
        UNP_PIPELINE_GOV_REBUILD_ENABLED: ${UNP_PIPELINE_GOV_REBUILD_ENABLED:-false}
        UNP_PIPELINE_GOV_REBUILD_INTERVAL_SECONDS: ${UNP_PIPELINE_GOV_REBUILD_INTERVAL_SECONDS:-86400}
        UNP_PIPELINE_RETRY_DELAY_SECONDS: ${UNP_PIPELINE_RETRY_DELAY_SECONDS:-60}
        PARSER_ALERTS_PROGRESS_INTERVAL_SECONDS: ${PARSER_ALERTS_PROGRESS_INTERVAL_SECONDS:-43200}
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
      networks:
        - egr_default
      cpus: 0.50
      mem_limit: 384m
      restart: unless-stopped
      stop_grace_period: 30s
      healthcheck:
        test: ["CMD-SHELL", "python -m app.workers.unp_pipeline --health || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      command: python -m app.workers.unp_pipeline

    telegram-bot:
      profiles:
        - telegram
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_telegram_bot
      env_file:
        - .env
      environment:
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_USER: ${DB_USER:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        SKIP_SQL_INIT: "1"
        TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-http://egr-api:8000}
        TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-}
        TELEGRAM_LOOKUP_LIMIT: ${TELEGRAM_LOOKUP_LIMIT:-5}
      volumes:
        - .:/app
      depends_on:
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      dns:
        - 8.8.8.8
        - 8.8.4.4
      mem_limit: 128m
      restart: unless-stopped
      command: python -m app.telegram_bot.runner

    egr-celery-worker:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_worker
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
        ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
        ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-egr_companies}
        ELASTICSEARCH_REQUIRE_SYNCED: ${ELASTICSEARCH_REQUIRE_SYNCED:-true}
        ELASTICSEARCH_QUEUE_BATCH_SIZE: ${ELASTICSEARCH_QUEUE_BATCH_SIZE:-500}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
        TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
        APP_URL: ${APP_URL:-https://company.tenders.by}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      mem_limit: 384m
      healthcheck:
        disable: true
      restart: unless-stopped
      command: celery -A app.tasks.celery_app worker --loglevel=info -Q celery --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100 --max-memory-per-child=240000

    egr-celery-worker-heavy:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_worker_heavy
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
        ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
        ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-egr_companies}
        ELASTICSEARCH_REQUIRE_SYNCED: ${ELASTICSEARCH_REQUIRE_SYNCED:-true}
        ELASTICSEARCH_QUEUE_BATCH_SIZE: ${ELASTICSEARCH_QUEUE_BATCH_SIZE:-500}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
      networks:
        - egr_default
      mem_limit: 384m
      healthcheck:
        disable: true
      restart: unless-stopped
      command: celery -A app.tasks.celery_app worker --queues=heavy --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=50

    egr-celery-worker-bankrot:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_worker_bankrot
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - egr_default
      mem_limit: 384m
      healthcheck:
        disable: true
      restart: unless-stopped
      command: celery -A app.tasks.celery_app worker --queues=bankrot --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1

    egr-celery-beat:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_celery_beat
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
        ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
        ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-egr_companies}
        ELASTICSEARCH_REQUIRE_SYNCED: ${ELASTICSEARCH_REQUIRE_SYNCED:-true}
        ELASTICSEARCH_QUEUE_BATCH_SIZE: ${ELASTICSEARCH_QUEUE_BATCH_SIZE:-500}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      mem_limit: 128m
      healthcheck:
        disable: true
      restart: unless-stopped
      # Schedule file in /tmp so appuser can write (volume /app is often read-only for container user)
      command: celery -A app.tasks.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

    data-init:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: egr_data_init
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?client_encoding=utf8
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
        CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/4}
        CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/5}
        ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
        ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
        ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-egr_companies}
        ELASTICSEARCH_REQUIRE_SYNCED: ${ELASTICSEARCH_REQUIRE_SYNCED:-true}
        ELASTICSEARCH_QUEUE_BATCH_SIZE: ${ELASTICSEARCH_QUEUE_BATCH_SIZE:-500}
        EGR_API_URL: ${EGR_API_URL:-http://egr.gov.by/api/v2/egr}
        EGR_MOBILE_API_URL: ${EGR_MOBILE_API_URL:-https://egr.gov.by/egrmobile/api/v1}
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
      volumes:
        - .:/app
        - ./data/egr_json_full:/app/data/egr_json_full
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        egr-api:
          condition: service_healthy
      networks:
        - egr_default
      command: /bin/bash /app/scripts/docker-init-data.sh

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          VITE_API_URL: ""
          # Ключ JS API Яндекс.Карт. Задаётся через .env (VITE_YANDEX_MAPS_API_KEY),
          # пусто = карта на карточке компании не показывается.
          VITE_YANDEX_MAPS_API_KEY: "${VITE_YANDEX_MAPS_API_KEY:-}"
      container_name: egr_frontend
      ports:
        # Только localhost — наружу фронт отдаётся через nginx (TLS + security-заголовки).
        - "127.0.0.1:3000:80"
      networks:
        - egr_default
      restart: unless-stopped
      # nginx:alpine без curl — используем wget, иначе healthcheck всегда unhealthy
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s

    frontend-dev:
      build:
        context: ./frontend
        dockerfile: Dockerfile.dev
      container_name: egr_frontend_dev
      environment:
        VITE_API_URL: http://localhost:8002
      ports:
        - "5173:5173"
      networks:
        - egr_default
      profiles:
        - dev

    # One-shot: copy Let's Encrypt certs to ./ssl before nginx starts
    ssl-copy:
      image: alpine:3.19
      container_name: egr_ssl_copy
      volumes:
        - "${LETSENCRYPT_LIVE:-/etc/letsencrypt/live/company.tenders.by}:/source:ro"
        - ./ssl:/dest
      user: "0"
      command: >
        sh -c "
        if [ -f /source/fullchain.pem ] && [ -f /source/privkey.pem ]; then
          cp /source/fullchain.pem /dest/ && cp /source/privkey.pem /dest/ &&
          chown -R 1000:1000 /dest &&
          echo 'SSL certs copied to ./ssl';
        else
          echo 'No certs at /source (fullchain.pem or privkey.pem missing), skipping copy';
        fi
        "
      restart: "no"

    egr-nginx:
      image: nginx:1.25-alpine
      container_name: egr_nginx
      ports:
        - "80:80"
        # 443 наружу слушает Xray (VLESS+Reality); nginx-HTTPS за ним на loopback,
        # трафик приходит с PROXY protocol (xver=1 ↔ listen ... proxy_protocol).
        - "127.0.0.1:8443:443"
      volumes:
        - ./nginx/conf.d:/etc/nginx/conf.d
        - ./ssl:/etc/nginx/ssl:ro
        - ./acme-webroot:/var/www/acme:ro
        - ./scripts/nginx-entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
      command: ["nginx", "-g", "daemon off;"]
      depends_on:
        ssl-copy:
          condition: service_completed_successfully
        egr-api:
          condition: service_healthy
        frontend:
          condition: service_healthy
      networks:
        - egr_default
      restart: unless-stopped

    gias-sync:
      profiles:
        - legacy-gias
      build:
        context: .
        dockerfile: Dockerfile
      container_name: gias_sync
      env_file:
        - .env
      environment:
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        SKIP_SQL_INIT: "1"
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
      networks:
        - egr_default
      restart: unless-stopped
      command: python -m gias.gias_plans

    gias-full-sync:
      profiles:
        - legacy-gias
      build:
        context: .
        dockerfile: Dockerfile
      container_name: gias_full_sync
      env_file:
        - .env
      environment:
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        SKIP_SQL_INIT: "1"
        GIAS_SYNC_YEARS: ${GIAS_SYNC_YEARS:-2026}
        GIAS_FULL_SYNC_LOOP: ${GIAS_FULL_SYNC_LOOP:-true}
        GIAS_FULL_SYNC_INTERVAL: ${GIAS_FULL_SYNC_INTERVAL:-3600}
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
      networks:
        - egr_default
      restart: unless-stopped
      command: python -m gias.gias_plans_all

    gias-fix-companies:
      profiles:
        - legacy-gias
      build:
        context: .
        dockerfile: Dockerfile
      container_name: gias_fix_companies
      env_file:
        - .env
      environment:
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT:-5432}
        DB_NAME: ${DB_NAME:-egr_db}
        DB_USER: ${DB_USER:-postgres}
        DB_PASSWORD: ${DB_PASSWORD:-postgres}
        SKIP_SQL_INIT: "1"
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
      networks:
        - egr_default
      restart: "no"
      command: python -m gias.fix_plans

    grafana:
      image: grafana/grafana:11.1.0
      container_name: egr_grafana
      env_file:
        - .env
      environment:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
        GF_USERS_ALLOW_SIGN_UP: "false"
        GF_AUTH_ANONYMOUS_ENABLED: "false"
        GF_SERVER_ROOT_URL: "https://company.tenders.by/grafana/"
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
        ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
        BANKROT_SCHEDULE_ENABLED: ${BANKROT_SCHEDULE_ENABLED:-false}
        GRP_SCHEDULE_ENABLED: ${GRP_SCHEDULE_ENABLED:-false}
        PVT_SCHEDULE_ENABLED: ${PVT_SCHEDULE_ENABLED:-false}
        LICENSE_SCHEDULE_ENABLED: ${LICENSE_SCHEDULE_ENABLED:-false}
        NALOG_DEBT_SCHEDULE_ENABLED: ${NALOG_DEBT_SCHEDULE_ENABLED:-false}
        SEZ_SCHEDULE_ENABLED: ${SEZ_SCHEDULE_ENABLED:-false}
        GIAS_SYNC_ENABLED: ${GIAS_SYNC_ENABLED:-true}
      volumes:
        - egr_grafana_data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
        - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      ports:
        - "127.0.0.1:3001:3000"
      networks:
        - egr_default
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy

volumes:
  egr_postgres_data:
    driver: local
  egr_elasticsearch_data:
    driver: local
  egr_grafana_data:
    driver: local

networks:
  egr_default:
    driver: bridge
