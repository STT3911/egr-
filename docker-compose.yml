version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: egr_db
    environment:
      POSTGRES_DB: egr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3911
    volumes:
      - egr_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - tendex_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: egr_redis
    ports:
      - "6380:6379"
    networks:
      - tendex_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  egr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tendex_egr_api
    environment:
      DATABASE_URL: postgresql://postgres:3911@db:5432/egr_db?client_encoding=utf8
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: egr_db
      DB_USER: postgres
      DB_PASSWORD: 3911
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      EGR_API_URL: http://egr.gov.by/api/v2/egr
      EGR_MOBILE_API_URL: https://egr.gov.by/egrmobile/api/v1
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - ./data/egr_json_full:/app/data/egr_json_full
    ports:
      - "8002:8000"
    depends_on:
      - db
      - redis
    networks:
      - tendex_default
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  egr-celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tendex_egr_celery_worker
    environment:
      DATABASE_URL: postgresql://postgres:3911@db:5432/egr_db?client_encoding=utf8
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: egr_db
      DB_USER: postgres
      DB_PASSWORD: 3911
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      EGR_API_URL: http://egr.gov.by/api/v2/egr
      EGR_MOBILE_API_URL: https://egr.gov.by/egrmobile/api/v1
    volumes:
      - .:/app
      - ./data/egr_json_full:/app/data/egr_json_full
    depends_on:
      - db
      - redis
      - egr-api
    networks:
      - tendex_default
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000

  egr-celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tendex_egr_celery_beat
    environment:
      DATABASE_URL: postgresql://postgres:3911@db:5432/egr_db?client_encoding=utf8
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: egr_db
      DB_USER: postgres
      DB_PASSWORD: 3911
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      EGR_API_URL: http://egr.gov.by/api/v2/egr
      EGR_MOBILE_API_URL: https://egr.gov.by/egrmobile/api/v1
    volumes:
      - .:/app
      - ./data/egr_json_full:/app/data/egr_json_full
    depends_on:
      - db
      - redis
      - egr-api
    networks:
      - tendex_default
    command: celery -A app.tasks.celery_app beat --loglevel=info

  egr-nginx:
    image: nginx:1.25-alpine
    container_name: tendex_egr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - egr-api
    networks:
      - tendex_default

networks:
  tendex_default:
    driver: bridge

volumes:
  egr_postgres_data:
    driver: local



