apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram-egr
    receivers:
      - uid: telegram_egr_1
        type: telegram
        settings:
          bottoken: "${ALERT_TELEGRAM_BOT_TOKEN}"
          chatid: "5464642461"
          parse_mode: "HTML"
          message: |
            {{ if eq .Status "resolved" }}✅ <b>Норма</b>{{ else if eq (index .CommonLabels "severity") "critical" }}🔴 <b>Сбой</b>{{ else }}⚠️ <b>Внимание</b>{{ end }}
            <b>{{ .CommonLabels.alertname }}</b>
            {{ range .Alerts }}• {{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false
