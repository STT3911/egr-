apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram-egr
    receivers:
      - uid: telegram_egr_1
        type: telegram
        settings:
          bottoken: "${ALERT_TELEGRAM_BOT_TOKEN}"
          chatid: "${ALERT_TELEGRAM_CHAT_ID}"
          parse_mode: "HTML"
          message: |
            {{ if eq .Status "firing" }}🔴 <b>EGR · сбой парсинга</b>{{ else }}✅ <b>EGR · восстановлено</b>{{ end }}
            <b>{{ .CommonLabels.alertname }}</b>
            {{ range .Alerts }}• {{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false
