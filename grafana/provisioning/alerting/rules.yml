apiVersion: 1

deleteRules:
  - orgId: 1
    uid: egr_sync_behind
  - orgId: 1
    uid: egr_backlog
  - orgId: 1
    uid: source_silent
  - orgId: 1
    uid: bankrot_sync_failed
  - orgId: 1
    uid: bankrot_sync_stale
  - orgId: 1
    uid: bankrot_dataset_errors

groups:
  - orgId: 1
    name: tendex-health
    folder: EGR
    interval: 5m
    rules:
      - uid: tendex_health_summary
        title: "Сводка состояния Tendex"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          scope: data-health
        annotations:
          summary: "{{ index $labels \"details\" }}"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: egr-postgres
            model:
              refId: A
              datasource:
                type: postgres
                uid: egr-postgres
              format: table
              rawSql: |
                WITH config AS (
                    SELECT
                        lower('${BANKROT_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS bankrot_enabled,
                        lower('${GRP_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS grp_enabled,
                        lower('${PVT_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS pvt_enabled,
                        lower('${LICENSE_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS license_enabled,
                        lower('${NALOG_DEBT_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS nalog_enabled,
                        lower('${SEZ_SCHEDULE_ENABLED}') IN ('true', '1', 'yes', 'on') AS sez_enabled,
                        lower('${GIAS_SYNC_ENABLED}') IN ('true', '1', 'yes', 'on') AS gias_enabled
                ),
                latest_bankrot AS (
                    SELECT status, error, started_at, finished_at
                    FROM bankrot_sync_runs
                    ORDER BY started_at DESC
                    LIMIT 1
                ),
                latest_bankrot_success AS (
                    SELECT finished_at,
                           COALESCE((stats_json ->> 'dataset_success_pct')::float8, 100) AS success_pct
                    FROM bankrot_sync_runs
                    WHERE status = 'done'
                    ORDER BY finished_at DESC
                    LIMIT 1
                ),
                bankrot_health AS (
                    SELECT
                        c.bankrot_enabled,
                        COALESCE(lb.status, 'missing') AS latest_status,
                        lb.error,
                        COALESCE(EXTRACT(EPOCH FROM (now() - lbs.finished_at)) / 3600, 999999)::float8 AS success_age_hours,
                        COALESCE(lbs.success_pct, 100)::float8 AS success_pct
                    FROM config c
                    LEFT JOIN latest_bankrot lb ON true
                    LEFT JOIN latest_bankrot_success lbs ON true
                ),
                source_ages AS (
                    SELECT 'ЕГР: карточки' AS source, true AS enabled,
                           EXTRACT(EPOCH FROM (now() - max(updated_at))) / 3600 AS age_hours
                    FROM egr_companies
                    UNION ALL
                    SELECT 'ЕГР Mobile: адреса', true,
                           EXTRACT(EPOCH FROM (now() - max(fetched_at))) / 3600
                    FROM egr_company_place_locations
                    UNION ALL
                    SELECT 'ГРП: плательщики', c.grp_enabled,
                           EXTRACT(EPOCH FROM (now() - max(g.fetched_at))) / 3600
                    FROM grp_taxpayer_data g CROSS JOIN config c
                    GROUP BY c.grp_enabled
                    UNION ALL
                    SELECT 'ПВТ: резиденты', c.pvt_enabled,
                           EXTRACT(EPOCH FROM (now() - max(p.last_seen_at))) / 3600
                    FROM pvt_resident_records p CROSS JOIN config c
                    GROUP BY c.pvt_enabled
                    UNION ALL
                    SELECT 'Лицензии', c.license_enabled,
                           EXTRACT(EPOCH FROM (now() - max(l.last_seen_at))) / 3600
                    FROM license_records l CROSS JOIN config c
                    GROUP BY c.license_enabled
                    UNION ALL
                    SELECT 'ГИАС: аккредитованные заказчики', c.gias_enabled,
                           EXTRACT(EPOCH FROM (now() - max(g.last_seen_at))) / 3600
                    FROM gias_accredited_customers g CROSS JOIN config c
                    GROUP BY c.gias_enabled
                    UNION ALL
                    SELECT 'ГИАС: недобросовестные поставщики', c.gias_enabled,
                           EXTRACT(EPOCH FROM (now() - max(l.last_seen_at))) / 3600
                    FROM locked_suppliers l CROSS JOIN config c
                    GROUP BY c.gias_enabled
                    UNION ALL
                    SELECT 'ЕАЭС: резиденты СЭЗ', c.sez_enabled,
                           EXTRACT(EPOCH FROM (now() - max(s.last_seen_at))) / 3600
                    FROM eaeu_sez_resident_records s CROSS JOIN config c
                    GROUP BY c.sez_enabled
                    UNION ALL
                    SELECT 'МНС: задолженности', c.nalog_enabled,
                           EXTRACT(EPOCH FROM (now() - max(n.created_at))) / 3600
                    FROM nalog_debt_records n CROSS JOIN config c
                    GROUP BY c.nalog_enabled
                ),
                issues AS (
                    SELECT 10 AS priority, 'critical' AS severity,
                           CASE
                               WHEN s.value IS NULL THEN 'ЕГР: отсутствует egr_last_sync_date'
                               ELSE 'ЕГР: ежедневная синхронизация отстаёт более чем на 3 дня'
                           END AS detail
                    FROM (SELECT 1) seed
                    LEFT JOIN egr_system_state s ON s.key = 'egr_last_sync_date'
                    WHERE s.value IS NULL OR current_date - s.value::date > 3

                    UNION ALL

                    SELECT 20, 'warning',
                           'ЕГР: очередь необработанных raw-строк превышает 50 000'
                    FROM egr_raw_company_data
                    WHERE processed_at IS NULL
                    HAVING count(*) > 50000

                    UNION ALL

                    SELECT 30, 'warning',
                           CASE
                               WHEN age_hours IS NULL THEN source || ': синхронизация включена, но данных нет'
                               ELSE source || ' не обновляется более 7 дней'
                           END
                    FROM source_ages
                    WHERE enabled AND (age_hours IS NULL OR age_hours > 168)

                    UNION ALL

                    SELECT 5,
                           CASE
                               WHEN latest_status = 'failed' OR success_age_hours > 48 THEN 'critical'
                               ELSE 'warning'
                           END,
                           'Bankrot: ' || concat_ws('; ',
                               CASE WHEN latest_status = 'failed' THEN
                                   'последний запуск failed — ' || replace(replace(replace(
                                       left(
                                           regexp_replace(COALESCE(error, 'причина не записана'), E'[\n\r]+', ' ', 'g'),
                                           350
                                       ),
                                       '&', '&amp;'
                                   ), '<', '&lt;'), '>', '&gt;')
                               END,
                               CASE WHEN latest_status = 'missing' THEN 'ещё не было ни одного запуска' END,
                               CASE WHEN success_age_hours > 48 THEN
                                   CASE WHEN success_age_hours >= 999999 THEN
                                       'успешных запусков ещё не было'
                                   ELSE
                                       'нет успешной синхронизации более 48 часов'
                                   END
                               END,
                               CASE WHEN success_pct < 95 THEN
                                   format('качество дочерних данных %s%%', round(success_pct))
                               END
                           )
                    FROM bankrot_health
                    WHERE bankrot_enabled
                      AND (
                          latest_status IN ('failed', 'missing')
                          OR success_age_hours > 48
                          OR success_pct < 95
                      )
                )
                SELECT
                    count(*)::float8 AS value,
                    CASE WHEN bool_or(severity = 'critical') THEN 'critical' ELSE 'warning' END AS severity,
                    string_agg(detail, E'\n• ' ORDER BY priority, detail) AS details
                FROM issues
                HAVING count(*) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
