apiVersion: 1

groups:
  - orgId: 1
    name: egr-health
    folder: EGR
    interval: 5m
    rules:
      # 1) ЕГР: ежедневная синхронизация отстаёт больше 3 дней (норма — отставание на 1 день).
      - uid: egr_sync_behind
        title: "ЕГР: ежедневная синхронизация отстаёт"
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "ЕГР daily sync отстаёт на {{ index $values \"A\" }} дн. Проверь egr_celery_worker / egr_last_sync_date."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: egr-postgres
            model:
              refId: A
              datasource:
                type: postgres
                uid: egr-postgres
              format: table
              rawSql: "SELECT (current_date - value::date)::float8 AS days_behind FROM egr_system_state WHERE key = 'egr_last_sync_date'"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]

      # 2) ЕГР: backlog необработанных raw-строк раздулся (обработка не успевает / воркер стоит).
      - uid: egr_backlog
        title: "ЕГР: backlog raw слишком большой"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "В очереди обработки {{ index $values \"A\" }} необработанных raw-строк (порог 50000)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: egr-postgres
            model:
              refId: A
              datasource:
                type: postgres
                uid: egr-postgres
              format: table
              rawSql: "SELECT count(*)::float8 AS pending FROM egr_raw_company_data WHERE processed_at IS NULL"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50000]

      # 3) Любой источник «молчит» больше 7 дней — мультисерийный алерт (по одному на источник).
      #    Порог щадящий (168ч), чтобы не ложно-срабатывать на редко обновляемых источниках.
      - uid: source_silent
        title: "Внешний реестр не обновляется >7 дней"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Источник {{ index $labels \"source\" }} молчит {{ index $values \"A\" }} дн."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: egr-postgres
            model:
              refId: A
              datasource:
                type: postgres
                uid: egr-postgres
              format: table
              rawSql: "SELECT source, round(age_hours/24.0)::float8 AS age_days FROM ( SELECT 'ЕГР: карточки' AS source, EXTRACT(EPOCH FROM (now() - max(updated_at)))/3600 AS age_hours FROM egr_companies UNION ALL SELECT 'ГРП: плательщики', EXTRACT(EPOCH FROM (now() - max(fetched_at)))/3600 FROM grp_taxpayer_data UNION ALL SELECT 'ЕГР Mobile: адреса', EXTRACT(EPOCH FROM (now() - max(fetched_at)))/3600 FROM egr_company_place_locations UNION ALL SELECT 'МАРТ: торговый реестр', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM trade_registry_records UNION ALL SELECT 'Лицензии', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM license_records UNION ALL SELECT 'ГИАС: аккред. заказчики', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM gias_accredited_customers UNION ALL SELECT 'ГИАС: недобросов. поставщики', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM locked_suppliers UNION ALL SELECT 'ПВТ: резиденты', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM pvt_resident_records UNION ALL SELECT 'ЕАЭС: резиденты СЭЗ', EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600 FROM eaeu_sez_resident_records UNION ALL SELECT 'МНС: задолженности', EXTRACT(EPOCH FROM (now() - max(created_at)))/3600 FROM nalog_debt_records UNION ALL SELECT 'Банкротство: дела', EXTRACT(EPOCH FROM (now() - max(updated_at)))/3600 FROM bankrot_cases ) t WHERE age_hours IS NOT NULL AND age_hours > 168"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [7]
