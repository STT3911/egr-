server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/xml+rss application/json application/javascript;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # index.html names the current hashed Vite bundles. It must never remain in
  # browser cache after a deployment, otherwise it can reference chunks that
  # no longer exist in the new frontend image.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Vite assets are content-hashed and may be cached indefinitely. Missing
  # assets must return a real 404; returning index.html breaks dynamic imports.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
